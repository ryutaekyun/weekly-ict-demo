<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNP AI Platform — 공개 시연(읽기 전용)</title>
<meta name="description" content="수집한 공식 공개 자료의 메타데이터와 규칙 기반 분류·이슈·후보주제를 둘러보는 읽기 전용 공개 시연">
<style>
:root{--bg:#f2f4f7;--panel:#fff;--panel2:#f7f9fb;--ink:#151b26;--muted:#5b6676;--border:#dce2ea;--navy:#002f67;--navy2:#1d4fa3;--navysoft:#e7edf6;--ok:#1f7a4d;--oksoft:#e3f3ea;--warn:#b4720a;--warnsoft:#fbf0dc;--bad:#c23b30;--badsoft:#fbe7e4;--idle:#8d97a6;--idlesoft:#eef1f5;--font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);word-break:keep-all;overflow-wrap:break-word;font-size:14px}
a{color:var(--navy2)}
header.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header.top b{font-size:16px}
header.top nav{display:flex;gap:6px;flex-wrap:wrap}
header.top nav a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:13px}
header.top nav a.active,header.top nav a:hover{background:rgba(255,255,255,.16)}
.banner{background:var(--warnsoft);border-bottom:1px solid #e5c77a;color:#6b5200;padding:8px 20px;font-size:12.5px}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:block;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--navy2)}
.tile .n{font-size:24px;font-weight:700;color:var(--navy)}
.tile.zero .n{color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,button.btn{padding:7px 9px;border-radius:8px;border:1px solid var(--border);font:inherit;font-size:13px;background:#fff;min-width:0}
button.btn{cursor:pointer}button.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;background:var(--idlesoft);color:var(--muted);margin-left:4px;white-space:nowrap}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.warn{background:var(--warnsoft);color:var(--warn)}.pill.bad{background:var(--badsoft);color:var(--bad)}.pill.navy{background:var(--navysoft);color:var(--navy)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px}
.card .t{font-size:14.5px;font-weight:700;margin-bottom:4px}
.card .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card .act{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.disabled{color:var(--muted);cursor:not-allowed;text-decoration:none}
.note{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--border);vertical-align:top}th{background:var(--panel2);border-top:0}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
@media(max-width:640px){main{padding:12px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <b>TNP AI Platform · 공개 시연</b>
  <nav id="nav" aria-label="주 메뉴">
    <a href="#/" data-nav="home">홈</a>
    <a href="#/news" data-nav="news">ICT 정보 탐색</a>
    <a href="#/issues" data-nav="issues">핵심 이슈</a>
    <a href="#/candidates" data-nav="candidates">후보주제</a>
    <a href="#/outputs" data-nav="outputs">시범 출력물</a>
    <a href="#/guide" data-nav="guide">시연 가이드</a>
    <a href="#/about" data-nav="about">시연 범위</a>
  </nav>
</header>
<div class="banner" id="banner" role="note">읽기 전용 공개 시연입니다. 데이터를 불러오는 중...</div>
<main id="app" aria-live="polite"></main>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PAGE_SIZE = 25;
const STATUS_TEXT = { document: "", homepage: "주소 확인 필요(기관 홈페이지로 보임)", search: "주소 확인 필요(검색 화면으로 보임)", invalid: "원문 링크 없음", missing: "원문 링크 없음" };
const MEMBERSHIP = { primary: "최초 문서", duplicate_report: "동일 사건 보도", follow_up: "후속 변화" };
const EVENT = { new_issue: "신규 이슈", additional_announcement: "추가 발표", substantive_change: "실질적 변경", follow_up_action: "후속 조치", no_substantive_change: "변화 없음(반복 보도)", insufficient_comparison_data: "비교 자료 부족" };
let S = null, OUT = null;
const byId = { doc: new Map(), issue: new Map(), cand: new Map() };
const fieldLabel = (c) => (S.fields.find((f) => f.code === c) || {}).label || c || "-";

function parseHash() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { parts: path.split("/").filter(Boolean), q: new URLSearchParams(qs || "") };
}
function go(path, params) {
  const q = new URLSearchParams();
  Object.entries(params || {}).forEach(([k, v]) => { if (v) q.set(k, v); });
  location.hash = "#/" + path + (q.toString() ? "?" + q : "");
}
function link(d) {
  // 제목 클릭 = 공식 원문(새 탭). 주소가 없으면 클릭을 막고 사유를 보여준다
  if (d.link_blocked || !d.url) return `<span class="disabled" title="${esc(d.link_note || "")}">${esc(d.title)}</span> <span class="pill bad">원문 링크 없음</span><div class="note">${esc(d.link_note || "")}</div>`;
  const warn = d.link_state !== "document" ? `<span class="pill warn" title="${esc(d.link_note || "")}">주소 확인 필요</span>` : "";
  return `<a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" data-testid="origin-link" title="공식 원문 열기(새 탭)">${esc(d.title)}</a>${d.is_pdf ? '<span class="pill ok">PDF</span>' : ""}${warn}`;
}
function docCard(d) {
  return `<div class="card" data-testid="news-card"><div class="t">${link(d)}</div>
    <div class="meta"><span>${esc(d.org || "-")}</span><span>${esc(d.country || "-")}</span><span>${esc(d.published || "발표일 미상")}</span>
    <span class="pill navy">${esc(fieldLabel(d.field))}</span><span class="pill">${esc(S.doc_types[d.type] || d.type)}</span>
    ${d.original_secured ? '<span class="pill ok">원문 확보</span>' : '<span class="pill">원문 미확보</span>'}</div>
    <div class="act"><a class="btn" href="#/doc/${d.id}" aria-label="상세 보기: ${esc(d.title)}">상세 보기</a>${d.issue_id ? `<a class="btn" href="#/issue/${d.issue_id}">관련 이슈</a>` : ""}</div></div>`;
}
const btnStyle = "display:inline-block;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;text-decoration:none;font-size:13px";
function setActive(name) { document.querySelectorAll("#nav a").forEach((a) => a.classList.toggle("active", a.dataset.nav === name)); }

// ---------------------------------------------------------------- 화면 ----
function viewHome() {
  setActive("home");
  $("#app").innerHTML = `<h1>ICT 9대 분야 탐색</h1><p class="sub">분야를 누르면 해당 분야로 분류된 공식 자료 목록으로 이동합니다. 분야는 출처 고정이 아니라 자료별 분류 결과를 기준으로 합니다.</p>
  <div class="grid">${S.fields.map((f) => `<a class="tile ${f.count ? "" : "zero"}" href="#/news?field=${f.code}" data-testid="field-tile-${f.code}"><div>${esc(f.label)}</div><div class="n">${f.count}</div>
    <div class="note">${f.count ? "관련 자료 보기" : "수집된 자료 없음 — 다른 분야로 채우지 않았습니다"}</div></a>`).join("")}</div>
  <div class="panel" style="margin-top:14px"><b>둘러보기 흐름</b>
  <p class="note" style="margin:6px 0 0">분야 선택 → 뉴스·정책자료 카드 → 제목 클릭 시 공식 원문(새 탭) / '상세 보기'는 이 화면 안의 상세 → 관련 이슈 → 후보주제</p></div>
  <div class="grid" style="margin-top:10px"><div class="tile"><div>수집·분류된 자료</div><div class="n" data-testid="total-docs">${S.meta.document_count}</div></div>
  <div class="tile"><div>핵심 이슈(복수 문서 ${S.dashboard ? S.dashboard.multi_document_issues : "-"}건)</div><div class="n">${S.meta.issue_count}</div></div><div class="tile"><div>후보주제(내부 검토 상태)</div><div class="n">${S.meta.candidate_count}</div></div>
  <div class="tile"><div>원문 전문 확보 자료</div><div class="n">${S.dashboard ? S.dashboard.with_original_text : "-"}</div></div></div>${dashPanels()}`;
}

function bars(rows, total) {
  return rows.map((r) => `<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;margin:3px 0"><span style="width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.name)}">${esc(r.name)}</span>
    <span style="flex:1;background:var(--idlesoft);border-radius:6px;height:10px"><span style="display:block;height:10px;border-radius:6px;background:var(--navy2);width:${Math.max(2, Math.round((r.count / total) * 100))}%"></span></span><b style="width:36px;text-align:right">${r.count}</b></div>`).join("");
}
function dashPanels() {
  const d = S.dashboard;
  if (!d) return "";
  const tot = S.meta.document_count || 1;
  return `<div class="panel" style="margin-top:12px" data-testid="collection-status"><b>수집·분류 현황</b> <span class="note">(수집 시점 스냅샷 · 기준일 ${esc(S.meta.generated_at.slice(0, 10))})</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:8px">
      <div><div class="note">발행기관별(상위)</div>${bars(d.by_org, tot)}</div><div><div class="note">자료 유형별</div>${bars(d.by_type, tot)}</div><div><div class="note">국가·지역별</div>${bars(d.by_country, tot)}</div></div>
    ${d.reconcile ? `<div class="note" style="margin-top:8px" data-testid="reconcile"><b>자료 수 구성</b>: 수집 ${d.reconcile.collected_total}건 = 분야 분류 완료 ${d.reconcile.matched}건(분야별 합계 ${d.reconcile.field_sum}건) + 분류 보류 ${d.reconcile.pending_review}건 + 분류 미처리 ${d.reconcile.unprocessed}건. 핵심 이슈 중 후보주제가 없는 이슈 ${d.reconcile.issues_without_candidate}건(행정·공지성). ${esc(d.reconcile.note)}</div>` : ""}
    <p class="note" style="margin:8px 0 0">분류 방식: ${esc(d.classification_method)}. 이 화면의 숫자는 스냅샷 데이터에서 직접 센 값이며 실시간 수집 결과가 아닙니다.</p></div>`;
}

function viewGuide() {
  setActive("guide");
  const f = (c) => `#/news?field=${c}`;
  $("#app").innerHTML = `<h1>시연 가이드 (공개 읽기 전용 화면)</h1><div class="panel" data-testid="demo-versions"><b>두 가지 공개 화면을 구분하세요.</b> ① <a href="../">기존 시연 화면(루트 주소)</a>은 제안용으로 만든 설명 화면이고, ② 지금 보는 <b>/preview/</b>는 실제 수집 자료를 스냅샷으로 담은 읽기 전용 화면입니다. 원문 링크가 열리지 않을 때는 아래를 확인하세요: <i>외부 사이트가 접속을 거부</i>하는 경우(기관 사이트 정책)와 <i>링크 자체 오류</i>는 구분해 표시합니다.</div><p class="sub">아래 순서대로 누르면 실제 수집 자료를 따라가며 둘러볼 수 있습니다. 이 화면은 조회 전용이며 저장·로그인·생성 기능은 로컬 통합 사이트에서만 동작합니다.</p>
  <div class="panel"><b>시나리오 A — 통신·방송·전파 정책동향</b><ol><li><a href="${f("bcast")}">방송·전파·위성 분야 열기</a> → FCC 등 공식 기관 자료 목록</li><li>카드 제목 클릭 → <b>공식 원문이 새 탭</b>으로 열림</li><li>'상세 보기' → 관련 이슈 → 후보주제의 추천 점수·산정 근거 확인</li></ol></div>
  <div class="panel"><b>시나리오 B — 기술·연구 동향 탐색</b><ol><li><a href="${f("ai")}">인공지능·데이터 분야 열기</a> → 검색창에 키워드 입력 후 정렬·기간 필터 적용</li><li>'상세 보기' → 같은 이슈의 관련 문서 비교</li><li><a href="#/candidates?field=ai">후보주제 목록</a>에서 점수·논쟁 가능성·검토 상태 확인</li></ol></div>
  <div class="panel"><b>시나리오 C — 시범 보고서·카드뉴스 결과 보기</b><ol><li><a href="#/outputs">시범 출력물</a>에서 후속 규정 반영 일반호(PDF·DOCX)와 카드뉴스(PPTX·PNG) 열기</li><li>모든 출력물은 <b>시범·내부용·IITP 미확인</b> 표시가 붙은 자료이며 실제 발간물이 아닙니다.</li></ol></div>
  <p class="note">후보주제 수정·원고 작성·보고서 생성은 로컬 통합 사이트에서 직접 해볼 수 있습니다(저장소 docs/DEMO_GUIDE.md 참고).</p>`;
}

function viewNews(q) {
  setActive("news");
  const f = { field: q.get("field") || "", country: q.get("country") || "", org: q.get("org") || "", type: q.get("type") || "", from: q.get("from") || "", to: q.get("to") || "",
    text: q.get("q") || "", orig: q.get("orig") || "", issue: q.get("issue") || "", sort: q.get("sort") || "new", page: Number(q.get("page") || 1) };
  const countries = [...new Set(S.documents.map((d) => d.country).filter(Boolean))].sort();
  const orgs = [...new Set(S.documents.map((d) => d.org).filter(Boolean))].sort();
  const opt = (v, cur, label) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label)}</option>`;
  let rows = S.documents.filter((d) =>
    (!f.field || d.field === f.field) && (!f.country || d.country === f.country) && (!f.org || d.org === f.org) && (!f.type || d.type === f.type) &&
    (!f.from || (d.published && d.published >= f.from)) && (!f.to || (d.published && d.published <= f.to)) &&
    (!f.orig || (f.orig === "yes" ? d.original_secured : !d.original_secured)) && (!f.issue || (f.issue === "yes" ? !!d.issue_id : !d.issue_id)) &&
    (!f.text || d.title.toLowerCase().includes(f.text.toLowerCase())));
  rows = rows.slice().sort((a, b) => f.sort === "old" ? (a.published || "").localeCompare(b.published || "") : f.sort === "title" ? a.title.localeCompare(b.title) : (b.published || "").localeCompare(a.published || ""));
  const total = rows.length, pages = Math.max(1, Math.ceil(total / PAGE_SIZE)), page = Math.min(Math.max(1, f.page), pages);
  const label = f.field ? fieldLabel(f.field) : "전체 분야";
  $("#app").innerHTML = `<h1>ICT 정보 탐색 — ${esc(label)}</h1><p class="sub">제목을 누르면 공식 원문이 새 탭에서 열립니다. 이 화면은 수집 시점의 정적 스냅샷입니다.</p>
  <form class="panel filters" id="f" aria-label="검색 조건">
    <select name="field" aria-label="분야"><option value="">전체 분야</option>${S.fields.map((x) => opt(x.code, f.field, `${x.label} (${x.count})`)).join("")}</select>
    <select name="country" aria-label="국가"><option value="">전체 국가·지역</option>${countries.map((c) => opt(c, f.country, c)).join("")}</select>
    <select name="org" aria-label="발행기관"><option value="">전체 발행기관</option>${orgs.map((c) => opt(c, f.org, c)).join("")}</select>
    <select name="type" aria-label="자료 유형"><option value="">전체 자료유형</option>${Object.entries(S.doc_types).map(([k, v]) => opt(k, f.type, v)).join("")}</select>
    <select name="orig" aria-label="원문 확보"><option value="">원문 확보 여부</option>${opt("yes", f.orig, "원문 확보")}${opt("no", f.orig, "원문 미확보")}</select>
    <select name="issue" aria-label="이슈 연결"><option value="">이슈 연결</option>${opt("yes", f.issue, "이슈에 연결됨")}${opt("no", f.issue, "이슈 미연결")}</select>
    <label>발표일 <input type="date" name="from" aria-label="발표일 시작" value="${esc(f.from)}"> ~ <input type="date" name="to" aria-label="발표일 끝" value="${esc(f.to)}"></label>
    <input name="q" aria-label="제목 검색어" placeholder="제목 키워드 검색" value="${esc(f.text)}" style="min-width:200px">
    <select name="sort" aria-label="정렬">${opt("new", f.sort, "발표일 최신순")}${opt("old", f.sort, "발표일 오래된순")}${opt("title", f.sort, "제목순")}</select>
    <button class="btn primary" type="submit">검색</button><a class="btn" style="${btnStyle}" href="#/news">조건 초기화</a>
    <span style="margin-left:auto" class="note" data-testid="result-count">총 ${total}건</span></form>
  <div id="list">${rows.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).map(docCard).join("") ||
    `<div class="panel empty" data-testid="empty-state">${f.field && !f.country && !f.org && !f.type && !f.text && !f.from && !f.to && !f.orig && !f.issue
      ? `'${esc(label)}' 분야로 분류된 수집 자료가 아직 없습니다 — 다른 분야 자료로 채우지 않았습니다(수집원 보강 필요).` : "조건에 맞는 자료가 없습니다."}</div>`}</div>
  <div class="pager"><button class="btn" id="prev" ${page <= 1 ? "disabled" : ""}>이전</button><span>${page} / ${pages}</span><button class="btn" id="next" ${page >= pages ? "disabled" : ""}>다음</button></div>`;
  const form = $("#f");
  const apply = (extra) => { const d = Object.fromEntries(new FormData(form).entries()); go("news", { ...d, ...extra }); };
  form.addEventListener("submit", (e) => { e.preventDefault(); apply({ page: "" }); });
  form.querySelectorAll("select,input[type=date]").forEach((el) => el.addEventListener("change", () => apply({ page: "" })));
  $("#prev").onclick = () => apply({ page: String(page - 1) });
  $("#next").onclick = () => apply({ page: String(page + 1) });
}

function viewDoc(id) {
  setActive("news");
  const d = byId.doc.get(id);
  if (!d) return ($("#app").innerHTML = `<div class="panel empty">자료를 찾을 수 없습니다.</div>`);
  const issue = d.issue_id ? byId.issue.get(d.issue_id) : null;
  const cands = issue ? S.candidates.filter((c) => c.issue_id === issue.id) : [];
  $("#app").innerHTML = `<p><a href="javascript:history.back()">← 이전 화면(검색 조건 유지)</a></p><h1>${esc(d.title)}</h1>
  <div class="panel"><dl class="kv"><dt>발행기관</dt><dd>${esc(d.org || "-")}</dd><dt>국가·지역</dt><dd>${esc(d.country || "-")}</dd><dt>발표일</dt><dd>${esc(d.published || "-")}</dd>
  <dt>ICT 분야</dt><dd>${esc(fieldLabel(d.field))}</dd><dt>자료 유형</dt><dd>${esc(S.doc_types[d.type] || d.type)}</dd><dt>원문 확보</dt><dd>${d.original_secured ? "원문(전문) 확보 — 전문은 공개 시연에 포함하지 않습니다" : "원문 미확보(링크로 확인)"}</dd>
  <dt>공식 원문</dt><dd>${link({ ...d, title: "공식 원문 열기 ↗" })}${d.link_note && !d.link_blocked ? `<div class="note">${esc(d.link_note)}</div>` : ""}</dd></dl></div>
  <div class="panel"><b>관련 이슈</b>${issue ? `<p><a href="#/issue/${issue.id}">${esc(issue.title)}</a> (문서 ${issue.documents.length}건)</p>` : `<p class="note">연결된 이슈가 없습니다.</p>`}
  <b>관련 후보주제</b>${cands.length ? cands.map((c) => `<p><a href="#/candidate/${c.id}">${esc(c.title)}</a> <span class="pill">${esc(c.internal_status)}</span></p>`).join("") : `<p class="note">연결된 후보주제가 없습니다.</p>`}</div>`;
}

function viewIssues(q) {
  setActive("issues");
  const field = q.get("field") || "", text = q.get("q") || "";
  const rows = S.issues.filter((i) => (!field || i.field === field) && (!text || i.title.toLowerCase().includes(text.toLowerCase())));
  $("#app").innerHTML = `<h1>핵심 이슈</h1><p class="sub">같은 사건을 다룬 문서를 규칙 기반으로 묶은 결과입니다(연구원 확인 전 자동 묶음일 수 있음).</p>
  <form class="panel filters" id="f"><select name="field" aria-label="분야"><option value="">전체 분야</option>${S.fields.map((x) => `<option value="${x.code}" ${x.code === field ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>
  <input name="q" placeholder="이슈 제목 검색" value="${esc(text)}" aria-label="이슈 검색"><button class="btn primary">검색</button><span class="note" style="margin-left:auto" data-testid="result-count">총 ${rows.length}건</span></form>
  <div class="panel" style="padding:0;overflow:auto"><table><thead><tr><th>분야</th><th>이슈</th><th>문서 수</th><th>최근 활동</th></tr></thead><tbody>${rows.slice(0, 200).map((i) =>
    `<tr><td>${esc(fieldLabel(i.field))}</td><td><a href="#/issue/${i.id}">${esc(i.title)}</a></td><td>${i.documents.length}</td><td>${esc(i.last_activity || "-")}</td></tr>`).join("") ||
    `<tr><td colspan="4" class="empty">조건에 맞는 이슈가 없습니다.</td></tr>`}</tbody></table></div>`;
  $("#f").addEventListener("submit", (e) => { e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries()); go("issues", d); });
}

function viewIssue(id) {
  setActive("issues");
  const i = byId.issue.get(id);
  if (!i) return ($("#app").innerHTML = `<div class="panel empty">이슈를 찾을 수 없습니다.</div>`);
  const cands = S.candidates.filter((c) => c.issue_id === i.id);
  $("#app").innerHTML = `<p><a href="javascript:history.back()">← 이전 화면</a></p><h1>${esc(i.title)}</h1><p class="sub">${esc(fieldLabel(i.field))} · 최근 활동 ${esc(i.last_activity || "-")}</p>
  <div class="panel"><b>관련 원문 전체 목록 (${i.documents.length}건)</b>${i.documents.map((m) => { const d = byId.doc.get(m.id); return d ? `<div class="card"><span class="pill navy">${esc(MEMBERSHIP[m.membership] || m.membership)}</span> ${link(d)}
    <div class="meta"><span>${esc(d.org || "-")}</span><span>${esc(d.country || "-")}</span><span>${esc(d.published || "-")}</span><a href="#/doc/${d.id}">상세 보기</a></div></div>` : ""; }).join("")}</div>
  <div class="panel"><b>타임라인</b>${i.timeline.length ? `<ul>${i.timeline.map((t) => `<li>${esc(t.date || "-")} · ${esc(EVENT[t.type] || t.type)}${byId.doc.get(t.document_id) ? ` · ${esc(byId.doc.get(t.document_id).title.slice(0, 60))}` : ""}</li>`).join("")}</ul>` : `<p class="note">타임라인 이벤트가 없습니다.</p>`}</div>
  <div class="panel"><b>이 이슈의 후보주제</b>${cands.length ? cands.map((c) => `<p><a href="#/candidate/${c.id}">${esc(c.title)}</a> <span class="pill">${esc(c.internal_status)}</span></p>`).join("") : `<p class="note">후보주제가 없습니다.</p>`}</div>`;
}

function viewCandidates(q) {
  setActive("candidates");
  const field = q.get("field") || "", status = q.get("status") || "", text = q.get("q") || "", sort = q.get("sort") || "score";
  const statuses = [...new Set(S.candidates.map((c) => c.internal_status))];
  let rows = S.candidates.filter((c) => (!field || c.field === field) && (!status || c.internal_status === status) && (!text || c.title.toLowerCase().includes(text.toLowerCase())));
  rows = rows.slice().sort((a, b) => sort === "title" ? a.title.localeCompare(b.title) : sort === "date" ? (b.announced || "").localeCompare(a.announced || "") : (b.score ?? -1) - (a.score ?? -1));
  $("#app").innerHTML = `<h1>후보주제</h1><p class="sub">'내부 검토 상태'는 연구원 내부 검토 단계이며 <b>IITP 공식 선정이 아닙니다</b>. 점수는 규칙 기반 추천 점수(일부 항목은 평가 보류일 수 있음)입니다.</p>
  <form class="panel filters" id="f"><select name="field" aria-label="분야"><option value="">전체 분야</option>${S.fields.map((x) => `<option value="${x.code}" ${x.code === field ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select>
  <select name="status" aria-label="내부 검토 상태"><option value="">전체 내부 검토 상태</option>${statuses.map((s) => `<option ${s === status ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
  <input name="q" placeholder="후보주제 검색" value="${esc(text)}" aria-label="후보주제 검색">
  <select name="sort" aria-label="정렬"><option value="score" ${sort === "score" ? "selected" : ""}>추천 점수순</option><option value="date" ${sort === "date" ? "selected" : ""}>발표일 최신순</option><option value="title" ${sort === "title" ? "selected" : ""}>제목순</option></select>
  <button class="btn primary">검색</button><span class="note" style="margin-left:auto" data-testid="result-count">총 ${rows.length}건</span></form>
  ${S.priority && S.priority.items.length && !field && !status && !text ? `<details class="panel" open data-testid="priority-panel"><summary><b>우선 검토 후보 ${S.priority.items.length}건</b> <span class="note">(규칙 기반 선별 · IITP 공식 선정 아님)</span></summary>
    <ul class="note" data-testid="priority-criteria">${S.priority.criteria.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
    <ol>${S.priority.items.map((it) => { const c = byId.cand.get(it.id); return c ? `<li data-testid="priority-item"><a href="#/candidate/${c.id}">${esc(c.title)}</a> <span class="pill">${esc(fieldLabel(c.field))}</span> <b>${it.priority_score}</b><div class="note">선별 이유: ${esc(it.reasons.join(" · "))}${it.flags.length ? " · " + esc(it.flags.join(" · ")) : ""}</div></li>` : ""; }).join("")}</ol></details>` : ""}
  <div class="panel" style="padding:0;overflow:auto"><table><thead><tr><th>분야</th><th>제목</th><th>발표일</th><th>출처</th><th>추천 점수</th><th>내부 검토 상태</th></tr></thead><tbody>${rows.slice(0, 200).map((c) =>
    `<tr><td>${esc(fieldLabel(c.field))}</td><td><a href="#/candidate/${c.id}">${esc(c.title)}</a></td><td>${esc(c.announced || "-")}</td><td>${esc(c.org || "-")}</td>
    <td>${c.score ?? "-"}${c.score_partial ? ' <span class="pill warn">부분 평가</span>' : ""}</td><td><span class="pill">${esc(c.internal_status)}</span></td></tr>`).join("") ||
    `<tr><td colspan="6" class="empty">조건에 맞는 후보주제가 없습니다.</td></tr>`}</tbody></table></div>`;
  $("#f").addEventListener("submit", (e) => { e.preventDefault(); go("candidates", Object.fromEntries(new FormData(e.target).entries())); });
  $("#f").querySelectorAll("select").forEach((el) => el.addEventListener("change", () => $("#f").requestSubmit()));
}

function viewCandidate(id) {
  setActive("candidates");
  const c = byId.cand.get(id);
  if (!c) return ($("#app").innerHTML = `<div class="panel empty">후보주제를 찾을 수 없습니다.</div>`);
  $("#app").innerHTML = `<p><a href="javascript:history.back()">← 이전 화면(검색 조건 유지)</a></p><h1>${esc(c.title)}</h1>
  <p class="sub">${esc(fieldLabel(c.field))} · ${esc(c.org || "-")} · 발표 ${esc(c.announced || "-")} · <span class="pill">내부 검토 상태: ${esc(c.internal_status)}</span> <span class="note">(IITP 공식 선정 아님)</span></p>
  <div class="panel"><b>규칙 기반 추천</b> <span class="note">(생성형 AI가 아닌 키워드·규칙 계산 · 연구원 검토 필요)</span><p>${esc(c.reason || "-")}${c.score_partial ? " — 일부 항목은 근거 부족으로 평가 보류(부분 평가 점수)" : ""}</p>
    <p><b>추천 점수</b> ${c.score ?? "-"}점 · <b>논쟁 가능성</b> <span class="pill ${c.dispute === "의견 대립 확인됨" ? "bad" : ""}" data-testid="dispute-label">${esc(c.dispute || "분석 전")}</span>${c.dispute_count ? ` (쟁점 ${c.dispute_count}건)` : ""}
    <span class="note">— 서로 다른 문서에서 상반된 주장이 규칙으로 확인된 경우에만 '의견 대립'으로 표시합니다.</span></p>
    ${c.breakdown && c.breakdown.length ? `<table data-testid="score-breakdown"><thead><tr><th>평가 기준</th><th>점수</th><th>산정 근거</th></tr></thead><tbody>${c.breakdown.map((b) => `<tr><td>${esc(b.criterion)}</td><td>${b.score ?? '<span class="pill warn">평가 보류</span>'}</td><td>${esc(b.note || (b.score == null ? "근거 자료가 없어 점수를 주지 않음" : "-"))}</td></tr>`).join("")}</tbody></table>` : ""}</div>
  <div class="panel"><b>근거 원문 (${c.document_ids.length}건)</b>${c.document_ids.map((id2) => { const d = byId.doc.get(id2); return d ? `<div class="card">${link(d)}<div class="meta"><span>${esc(d.org || "-")}</span><span>${esc(d.published || "-")}</span>
    <a href="#/doc/${d.id}">상세 보기</a></div></div>` : ""; }).join("") || `<p class="note">연결된 원문이 없습니다.</p>`}</div>
  <p><a href="#/issue/${c.issue_id}">관련 핵심 이슈 보기 →</a></p>`;
}

function viewOutputs() {
  setActive("outputs");
  const items = (OUT && OUT.items) || [];
  $("#app").innerHTML = `<h1>시범 출력물</h1><p class="sub">실제 공개 자료(공식 문서)를 바탕으로 만든 시범 결과물과 합성 테스트 자료입니다. 모두 <b>실제 발간물이 아닙니다</b>.</p>` +
    (items.length ? `<div class="grid">${items.map((o) => `<div class="card"><div class="t">${esc(o.title)}</div><div class="note">${esc(o.note)}</div>
      <div class="act">${o.files.map((f) => `<a class="btn" style="${btnStyle}" href="${esc(f.path)}" target="_blank" rel="noopener noreferrer">${esc(f.label)}</a>`).join("")}</div></div>`).join("")}</div>`
      : `<div class="panel empty" data-testid="no-outputs">공개 가능한 시범 출력물은 아직 게시되지 않았습니다. 보고서·카드뉴스 제작과 파일 다운로드는 로컬 통합 웹사이트에서 실행합니다.</div>`);
}

function viewAbout() {
  setActive("about");
  $("#app").innerHTML = `<h1>공개 시연의 범위</h1>
  <div class="panel"><b>이 화면에서 되는 것(읽기 전용)</b><ul><li>ICT 9대 분야별 공식 자료 탐색, 검색·필터·정렬</li><li>제목 클릭 시 공식 원문 새 탭 열기(주소가 없거나 검증이 필요한 경우 표시)</li><li>핵심 이슈·후보주제 열람과 서로 이동</li></ul></div>
  <div class="panel"><b>이 화면에서 되지 않는 것</b><ul><li>로그인, 후보 등록·수정, 검토의견, 원고 작성, 보고서·카드뉴스 생성과 다운로드 — 이 기능은 <b>로컬 통합 웹사이트(Next.js + FastAPI)</b>에서 실제로 저장되고 동작합니다.</li>
  <li>실시간 수집 — 이 화면은 수집 시점의 <b>정적 스냅샷</b>입니다.</li><li>원문 전문 재배포 — 전문·연구원 검토의견·개인정보·비공개 원고는 스냅샷에 포함하지 않습니다.</li></ul></div>
  <div class="panel note">${esc(S.meta.data_basis)}<br>${esc(S.meta.notice)}</div>`;
}

function route() {
  if (!S) return;
  const { parts, q } = parseHash();
  const [a, b] = parts;
  window.scrollTo(0, 0);
  if (!a) return viewHome();
  if (a === "news") return viewNews(q);
  if (a === "doc") return viewDoc(b);
  if (a === "issues") return viewIssues(q);
  if (a === "issue") return viewIssue(b);
  if (a === "candidates") return viewCandidates(q);
  if (a === "candidate") return viewCandidate(b);
  if (a === "outputs") return viewOutputs();
  if (a === "about") return viewAbout();
  if (a === "guide") return viewGuide();
  return viewHome();
}

async function boot() {
  try {
    const r = await fetch("data/snapshot.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("스냅샷을 불러오지 못했습니다(HTTP " + r.status + ")");
    S = await r.json();
  } catch (e) {
    $("#banner").textContent = "공개 시연 데이터를 불러오지 못했습니다. 웹 서버(또는 GitHub Pages)에서 열어야 합니다.";
    $("#app").innerHTML = `<div class="panel empty" role="alert">${esc(e.message)}</div>`;
    return;
  }
  try { const r2 = await fetch("data/outputs.json", { cache: "no-cache" }); if (r2.ok) OUT = await r2.json(); } catch (e) { OUT = null; }
  S.documents.forEach((d) => byId.doc.set(d.id, d));
  S.issues.forEach((i) => byId.issue.set(i.id, i));
  S.candidates.forEach((c) => byId.cand.set(c.id, c));
  $("#banner").innerHTML = `읽기 전용 공개 시연 · 데이터 기준일 <b>${esc(S.meta.generated_at.slice(0, 10))}</b>(수집 시점의 정적 스냅샷, 실시간 아님) · 자료 발표일 범위 ${esc(S.meta.published_min || "-")} ~ ${esc(S.meta.published_max || "-")} · 로그인·저장·파일 생성은 로컬 통합 웹사이트에서만 동작합니다`;
  window.addEventListener("hashchange", route);
  route();
}
boot();
</script>
</body>
</html>
